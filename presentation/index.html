<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F0F12">
  <title>AI-харнессы · презентация модуля</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#stage">К содержанию</a>
  <div id="app" class="app" aria-live="polite">
    <header class="topbar" data-auto-hide>
      <a class="brand" href="/" data-route aria-label="На главную">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <span><b>ЦЕХ</b><small>ХАРНЕССЫ</small></span>
      </a>
      <nav class="lesson-nav" aria-label="Уроки">
        <a href="/lesson/1" data-route>01</a>
        <a href="/lesson/2" data-route>02</a>
        <a href="/lesson/3" data-route>03</a>
        <a href="/lesson/4" data-route>04</a>
        <a href="/sources" data-route>Источники</a>
      </nav>
      <div class="top-actions">
        <button type="button" data-action="sources" aria-label="Показать источники">S · Источники</button>
        <button type="button" data-action="fullscreen" aria-label="Полноэкранный режим">F · Экран</button>
      </div>
    </header>

    <main id="stage" class="stage" tabindex="-1"></main>

    <aside id="source-drawer" class="drawer" aria-hidden="true" aria-label="Источники экрана">
      <div class="drawer-head">
        <div><span class="micro">Проверка</span><h2>Источники экрана</h2></div>
        <button type="button" data-action="sources-close" aria-label="Закрыть источники">Закрыть</button>
      </div>
      <div id="source-list"></div>
    </aside>

    <aside id="presenter-notes" class="presenter-notes" data-auto-hide aria-label="Заметки ведущего"></aside>

    <div class="presenter-bar" data-auto-hide hidden>
      <button type="button" data-action="prev" aria-label="Предыдущий шаг">←</button>
      <button type="button" data-action="next" aria-label="Следующий шаг">→</button>
      <button type="button" data-action="reset">R · Reset</button>
      <button type="button" data-action="map">M · Карта</button>
      <button type="button" data-action="export-svg">SVG</button>
      <button type="button" data-action="export-png">PNG</button>
      <button type="button" data-action="capture">C · Controls</button>
    </div>

    <button id="progress" class="progress" type="button" data-action="progress" aria-label="Скрыть прогресс"></button>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <dialog id="jump-dialog" class="jump-dialog">
    <form method="dialog" id="jump-form">
      <span class="micro">Быстрый переход</span>
      <h2>Номер экрана</h2>
      <p>Введи номер в текущем уроке или полный ID, например P3-06.</p>
      <label><span class="sr-only">Номер или ID экрана</span><input id="jump-input" name="screen" autocomplete="off" placeholder="6 или P3-06"></label>
      <div class="dialog-actions"><button value="cancel">Отмена</button><button value="default" data-submit>Перейти</button></div>
    </form>
  </dialog>

  <noscript>Для навигации и пошаговых состояний презентации нужен JavaScript.</noscript>
  <script src="/app.js" defer></script>
</body>
</html>
