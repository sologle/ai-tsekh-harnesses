<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F0F12">
  <title>AI-харнессы · презентация модуля</title>
  <script>
    (function () {
      var seg = location.pathname.replace(/[^/]*$/, "");
      var idx = seg.indexOf("/presentation/");
      window.__BASE__ = idx >= 0 ? seg.slice(0, idx + "/presentation/".length) : seg;
      if (/\/lesson\/$/.test(window.__BASE__)) window.__BASE__ = window.__BASE__.replace(/lesson\/$/, "");
    })();
  </script>
  <script>document.write('<link rel="stylesheet" href="' + window.__BASE__ + 'styles.css">');</script>
</head>
<body>
  <a class="skip-link" href="#stage">К содержанию</a>
  <div id="app" class="app" aria-live="polite">
    <header class="topbar" data-auto-hide>
      <a class="brand" href="/" data-route aria-label="На главную">
        <span class="brand-mark" aria-hidden="true">AI</span>
        <span><b>ЦЕХ</b><small>ХАРНЕССЫ</small></span>
      </a>
      <nav class="lesson-nav" aria-label="Уроки">
        <a href="./lesson/1" data-route>01</a>
        <a href="./lesson/2" data-route>02</a>
        <a href="./lesson/3" data-route>03</a>
        <a href="./lesson/4" data-route>04</a>
        <a href="./matrix" data-route>Матрица</a>
        <a href="./sources" data-route>Источники</a>
      </nav>
      <div class="top-actions">
        <button type="button" data-action="sources" aria-label="Показать источники">S · Источники</button>
        <button type="button" data-action="fullscreen" aria-label="Полноэкранный режим">F · Экран</button>
      </div>
    </header>

    <main id="stage" class="stage" tabindex="-1"></main>

    <aside id="source-drawer" class="drawer" aria-hidden="true" aria-label="Источники страницы">
      <div class="drawer-head">
        <div><span class="micro">Проверка</span><h2>Источники</h2></div>
        <button type="button" data-action="sources-close" aria-label="Закрыть источники">Закрыть</button>
      </div>
      <div id="source-list"></div>
    </aside>

    <aside id="presenter-notes" class="presenter-notes" data-auto-hide aria-label="Заметки ведущего" hidden></aside>

    <div class="presenter-bar" data-auto-hide hidden>
      <button type="button" data-action="top">T · Вверх</button>
      <button type="button" data-action="sources">S · Источники</button>
      <button type="button" data-action="fullscreen">F · Экран</button>
      <button type="button" data-action="capture">C · Controls</button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <noscript>Для long grid и матрицы нужен JavaScript.</noscript>
  <script>document.write('<script src="' + window.__BASE__ + 'app.js" defer><\/script>');</script>
</body>
</html>
