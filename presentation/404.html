<!doctype html><html lang="ru"><meta charset="utf-8"><title>AI.Цех: переход к урокам</title>
<script>
(() => {
  const path = location.pathname;
  const marker = path.indexOf("/presentation/");
  const base = marker >= 0 ? path.slice(0, marker + 14) : "/";
  const params = new URLSearchParams(location.search);
  const lesson = path.match(/\/lesson\/([1-4])\/?$/);
  if (lesson) params.set("lesson", lesson[1]);
  else if (/\/matrix\/?$/.test(path)) params.set("matrix", "1");
  else if (/\/sources\/?$/.test(path)) params.set("sources", "1");
  location.replace(base + "?" + params.toString() + location.hash);
})();
</script><p>Переход к материалам модуля.</p></html>
