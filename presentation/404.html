<!doctype html><meta charset="utf-8"><title>AI-харнессы · презентация</title>
<script>
(function(){
  var base = location.pathname.indexOf("/presentation/") >= 0 ? "/presentation/" : "/";
  var params = new URLSearchParams(location.search);
  var lesson = location.pathname.match(/\/lesson\/([1-4])/);
  if (lesson) params.set("lesson", lesson[1]);
  if (location.pathname.indexOf("/sources") >= 0) params.set("sources", "1");
  location.replace(base + (params.toString() ? "?" + params.toString() : "") + location.hash);
})();
</script>
