<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F0F12">
  <meta name="description" content="Четыре урока AI.Цех: выбираем AI-харнессы, переносим проект, меняем среду и сохраняем контроль.">
  <link rel="icon" href="data:,">
  <title>AI-харнессы · AI.Цех</title>
  <script>
    (() => {
      const path = location.pathname;
      const marker = path.indexOf("/presentation/");
      window.__BASE__ = marker >= 0 ? path.slice(0, marker + 14) : path.replace(/(?:lesson\/[1-4]|matrix|sources)\/?$/, "").replace(/index\.html$/, "");
      if (!window.__BASE__.endsWith("/")) window.__BASE__ += "/";
      const cb = new URLSearchParams(location.search).get("cb");
      window.__ASSET_QUERY__ = cb ? "?cb=" + encodeURIComponent(cb) : "";
      const style = document.createElement("link");
      style.rel = "stylesheet";
      style.href = window.__BASE__ + "styles.css" + window.__ASSET_QUERY__;
      document.head.append(style);
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#stage">К содержанию</a>
  <div id="app"><main id="stage" class="stage" tabindex="-1"></main></div>
  <div id="route-status" class="sr-only" role="status" aria-live="polite"></div>
  <div class="progress-bar" aria-hidden="true"></div>
  <noscript>Для чтения уроков нужен JavaScript. Текстовые материалы доступны в репозитории проекта.</noscript>
  <script>
    const script = document.createElement("script");
    script.src = window.__BASE__ + "app.js" + window.__ASSET_QUERY__;
    document.body.append(script);
  </script>
</body>
</html>
