<!doctype html><meta charset="utf-8"><title>AI.Цех · Харнессы</title>
<script>
(function(){
  var path = location.pathname;
  var params = new URLSearchParams(location.search);
  if (path.indexOf("/presentation/") === 0 || path === "/presentation") {
    var lesson = path.match(/\/lesson\/([1-4])/);
    if (lesson) params.set("lesson", lesson[1]);
    if (path.indexOf("/sources") >= 0) params.set("sources", "1");
    location.replace("/presentation/" + (params.toString() ? "?" + params.toString() : "") + location.hash);
  } else {
    location.replace("/" + (params.toString() ? "?" + params.toString() : "") + location.hash);
  }
})();
</script>
